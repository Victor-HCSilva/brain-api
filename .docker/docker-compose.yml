name: brain

services:
  db:
    image: postgres:16-alpine
    container_name: brain_postgres
    restart: always
    env_file:
      - ../.envs/.env
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'     
          memory: 256M     

  redis:
    image: redis:7-alpine
    container_name: brain_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'    
          memory: 128M    

  api:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: brain_api
    restart: always
    command: python manage.py runserver 0.0.0.0:7655
    volumes:
      - ../src:/app/src
      - ../media:/app/media
    ports:
      - "7655:7655"
    env_file:
      - ../.envs/.env
    environment:
      TRUSTED_ORIGINS: "localhost,127.0.0.1,api"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 7655), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '0.80'    
          memory: 512M    

  interface:
    build:
      context: ../../brain-interface
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://api:7655
    container_name: brain_interface
    restart: always
    environment:
      BACKEND_URL: http://api:7655
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  celery_worker:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: brain_celery_worker
    restart: always
    command: python -m celery -A core worker -l info --concurrency=1
    volumes:
      - ../src:/app/src
    env_file:
      - ../.envs/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M

  celery_beat:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: brain_celery_beat
    restart: always
    command: python -m celery -A core beat -l info
    volumes:
      - ../src:/app/src
    env_file:
      - ../.envs/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.20'     # Beat é apenas um relógio/agendador
          memory: 128M